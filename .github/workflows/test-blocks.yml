name: Test blocks

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'workflow/**'
      - 'video/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'workflow/**'
      - 'video/**'
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run still building 100+ blocks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # src/ imports ../../../bpl-tools and webpack.config.js has a ../bpl-tools entry,
  # so bpl-tools is checked out next to b-blocks, as it sits in wp-content/plugins.
  BPL_TOOLS_REF: main

jobs:
  js:
    name: Lint and build blocks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out b-blocks
        uses: actions/checkout@v4
        with:
          path: b-blocks

      - name: Check out bpl-tools (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: bPlugins/bpl-tools
          ref: ${{ env.BPL_TOOLS_REF }}
          path: bpl-tools

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: b-blocks/package-lock.json

      - name: Install b-blocks dependencies
        working-directory: b-blocks
        run: npm ci --no-audit --no-fund

      # bpl-tools commits no package-lock.json, so its node_modules are cached by
      # its package.json. Its components import @dnd-kit, immer, react-ace and
      # select-pure, which webpack resolves from bpl-tools/node_modules.
      - name: Cache bpl-tools node_modules
        id: bpl-cache
        uses: actions/cache@v4
        with:
          path: bpl-tools/node_modules
          key: bpl-tools-${{ runner.os }}-node22-${{ hashFiles('bpl-tools/package.json') }}

      - name: Install bpl-tools dependencies
        if: steps.bpl-cache.outputs.cache-hit != 'true'
        working-directory: bpl-tools
        # --legacy-peer-deps: @dnd-kit's react peer range conflicts with
        # @wordpress/components' react-dom 19 peer.
        run: npm install --omit=dev --no-package-lock --legacy-peer-deps --no-audit --no-fund

      - name: Lint (npm run lint)
        working-directory: b-blocks
        run: npm run lint

      - name: Build blocks (npm run build)
        working-directory: b-blocks
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Check every enabled block was built
        working-directory: b-blocks
        run: |
          node -e "
          const fs = require('fs');
          const { removeBlocks } = require('./webpack-remove-block');
          const blocks = fs.readdirSync('src').filter((d) => fs.existsSync('src/' + d + '/block.json') && !removeBlocks.includes(d));
          const missing = blocks.filter((d) => !fs.existsSync('build/' + d + '/block.json'));
          const leaked = removeBlocks.filter((d) => fs.existsSync('build/' + d));
          console.log('Built ' + (blocks.length - missing.length) + '/' + blocks.length + ' blocks; ' + removeBlocks.length + ' removed on purpose.');
          if (missing.length) { console.log('::error::Missing from build/: ' + missing.join(', ')); process.exitCode = 1; }
          if (leaked.length) { console.log('::error::Removed blocks still in build/: ' + leaked.join(', ')); process.exitCode = 1; }
          "

      - name: Upload build for the WordPress test
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: b-blocks/build
          retention-days: 3

  php:
    name: PHP ${{ matrix.php }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the lowest the code runs on today (includes/ApiKeys.php uses an
        # arrow function); readme.txt still says "Requires PHP: 7.2".
        php: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: PHP syntax check (php -l)
        run: |
          git ls-files -z '*.php' ':!:vendor/**' ':!:node_modules/**' \
            | xargs -0 -n 1 -P 4 php -l -d display_errors=1 > php-lint.log 2>&1 || true
          echo "Checked $(grep -c '^No syntax errors' php-lint.log) PHP files."
          if grep -v '^No syntax errors' php-lint.log | grep -q .; then
            grep -v '^No syntax errors' php-lint.log
            echo '::error::PHP syntax errors found'
            exit 1
          fi

      - name: PHPUnit (when configured)
        run: |
          if { [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; } && [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo '::notice::No PHPUnit config or vendor/bin/phpunit in the repo; skipped.'
          fi

  wp-integration:
    name: WordPress + WooCommerce test (.wpd-test.php)
    needs: js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking for now: .wpd-test.php was written for an older
    # woo-product-details render and fails 12 of its 29 checks on the current
    # code. Remove this line once the test is updated.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: b-blocks

      - name: Look for .wpd-test.php
        id: wpd
        run: |
          if [ -f b-blocks/.wpd-test.php ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo '::notice::No .wpd-test.php; skipped.'; fi

      - name: Download build
        if: steps.wpd.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build
          path: b-blocks/build

      - name: Set up PHP and WP-CLI
        if: steps.wpd.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: wp-cli
          extensions: pdo_sqlite, sqlite3, mysqli, intl, gd, zip
          coverage: none

      # Throwaway WordPress on SQLite in the runner's temp dir. The test creates
      # and deletes its own products; nothing outside this runner is touched.
      - name: Run .wpd-test.php
        if: steps.wpd.outputs.present == 'true'
        env:
          WP_DIR: ${{ runner.temp }}/wp
          PLUGIN_SRC: ${{ github.workspace }}/b-blocks
        run: |
          set -euo pipefail
          mkdir -p "$WP_DIR"
          wp() { command wp --path="$WP_DIR" "$@"; }

          wp core download --quiet
          wp config create --dbname=wp --dbuser=wp --dbpass=wp --skip-check --quiet
          wp config set WP_DEBUG true --raw --quiet

          SQLITE_ZIP="$RUNNER_TEMP/sqlite.zip"
          curl -fsSL -o "$SQLITE_ZIP" https://downloads.wordpress.org/plugin/sqlite-database-integration.latest-stable.zip
          unzip -q -o "$SQLITE_ZIP" -d "$WP_DIR/wp-content/plugins/"
          sed -e "s#{SQLITE_IMPLEMENTATION_FOLDER_PATH}#$WP_DIR/wp-content/plugins/sqlite-database-integration#" \
              -e "s#{SQLITE_PLUGIN}#sqlite-database-integration/load.php#" \
              "$WP_DIR/wp-content/plugins/sqlite-database-integration/db.copy" > "$WP_DIR/wp-content/db.php"

          wp core install --url=http://localhost --title=CI --admin_user=ci --admin_password=ci --admin_email=ci@example.com --skip-email --quiet
          wp plugin install woocommerce --activate --quiet
          ln -s "$PLUGIN_SRC" "$WP_DIR/wp-content/plugins/b-blocks"
          wp plugin activate b-blocks --quiet

          wp eval-file "$PLUGIN_SRC/.wpd-test.php" | tee "$WP_DIR/wpd-test.log"

          # The script prints PASS/FAIL lines and never exits non-zero by itself.
          grep -q '^PASS ' "$WP_DIR/wpd-test.log" || { echo '::error::.wpd-test.php printed no PASS lines'; exit 1; }
          if grep -qE '^FAIL |^cleanup: LEFTOVER' "$WP_DIR/wpd-test.log"; then
            grep -E '^FAIL |^cleanup: LEFTOVER' "$WP_DIR/wpd-test.log" | sed 's/^/::error::/'
            exit 1
          fi
